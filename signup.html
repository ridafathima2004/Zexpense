<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zexpense - Sign Up</title>
    <link rel="stylesheet" href="signup.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBKTMydhOiGqhcBb3OSNrGRDQ8Y8D7npk8",
  authDomain: "zexpense-a4bf3.firebaseapp.com",
  projectId: "zexpense-a4bf3",
  storageBucket: "zexpense-a4bf3.appspot.com",
  messagingSenderId: "983153509883",
  appId: "1:983153509883:web:7483e1189ee501ac2ab75e"
};

firebase.initializeApp(firebaseConfig);
</script>
</head>
<body>
    <div class="signup">
    <form id="signupForm">
        <h1>Create Account</h1>
        <label>Full Name:</label>
        <input type="text" id="fullName" placeholder="Enter your full name" required>

        <label>Email:</label>
        <input type="email" id="signupEmail" placeholder="Enter your email" required>

        <label>Password:</label>
        <input type="password" id="signupPassword" placeholder="Create password" required>

        <label>Confirm Password:</label>
        <input type="password" placeholder="Confirm password" required>

        <button type="submit">Sign Up</button>
    </form>
<script>
document.getElementById("signupForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const fullName = document.getElementById("fullName").value;
    const email = document.getElementById("signupEmail").value;
    const password = document.getElementById("signupPassword").value;

    firebase.auth().createUserWithEmailAndPassword(email, password)
    .then((userCredential) => {

        const user = userCredential.user;

        // SAVE FULL NAME INTO FIREBASE AUTH
        return user.updateProfile({
            displayName: fullName
        });

    })
    .then(() => {
        alert("Account created successfully!");
        window.location.href = "login.html";
    })
    .catch((error) => {
        alert(error.message);
    });
});
</script>

</body>
</html>
