<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="expense.css">
</head>

<body>
    <div class="form-container">
        <div class="form-card">
            <h3>Add New Expense</h3>

            <div class="form-row">
                <label>Amount</label>
                <input type="number" id="amountInput" placeholder="Enter amount">
            </div>

            <div class="form-row">
                <label>Category</label>
                <select id="categorySelect" onchange="toggleCategoryInput()">
                    <option>Food</option>
                    <option>Travel</option>
                    <option>Fashion</option>
                    <option>Entertainment</option>
                    <option>Education</option>
                    <option value="Other">Other</option>
                </select>

                <input type="text" id="customCategory" placeholder="Enter your category"
                    style="display: none; margin-top: 8px;">
            </div>
            <div class="form-row">
                <label>Reason</label>
                <select id="reasonSelect" onchange="toggleReasonInput()">
                    <option selected>Necessary</option>
                    <option>Stress</option>
                    <option>Social Pressure</option>
                    <option>Boredom</option>
                    <option>Celebration</option>
                    <option value="Other">Other</option>
                </select>

                <input type="text" id="customReason" placeholder="Enter your reason"
                    style="display: none; margin-top: 8px;">
            </div>

            <div class="form-row">
                <label>Mood</label>
                <select id="moodSelect" onchange="toggleMoodInput()">
                    <option selected>Neutral</option>
                    <option>Happy</option>
                    <option>Sad</option>
                    <option>Angry</option>
                    <option value="Other">Other</option>
                </select>

                <input type="text" id="customMood" placeholder="Enter your mood"
                    style="display: none; margin-top: 8px;">
            </div>

            <div class="form-row">
                <label>Time</label>
                <input type="time" id="timeInput">
            </div>

            <button type="button" class="add-btn" onclick="addExpense()">Add Expense</button>
            <button type="button" class="back-btn" onclick="window.location.href='home.html'"
                style="margin-top: 10px;">Back to Home</button>
        </div>
    </div>

    <script>
        // Toggle functions for custom inputs
        function toggleCategoryInput() {
            const select = document.getElementById("categorySelect");
            const customInput = document.getElementById("customCategory");
            customInput.style.display = select.value === "Other" ? "block" : "none";
        }

        function toggleReasonInput() {
            const select = document.getElementById("reasonSelect");
            const customInput = document.getElementById("customReason");
            customInput.style.display = select.value === "Other" ? "block" : "none";
        }

        function toggleMoodInput() {
            const select = document.getElementById("moodSelect");
            const customInput = document.getElementById("customMood");
            customInput.style.display = select.value === "Other" ? "block" : "none";
        }
    </script>

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import {
            getFirestore,
            collection,
            addDoc,
            serverTimestamp,
            doc,
            updateDoc,
            increment
        } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBKTMydhOiGqhcBb3OSNrGRDQ8Y8D7npk8",
            authDomain: "zexpense-a4bf3.firebaseapp.com",
            projectId: "zexpense-a4bf3",
            storageBucket: "zexpense-a4bf3.appspot.com",
            messagingSenderId: "983153509883",
            appId: "1:983153509883:web:7483e1189ee501ac2ab75e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null;

        // Check if user is logged in
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                alert("Please login first.");
                window.location.href = "login.html";
            } else {
                currentUser = user;
            }
        });

        // Make function global
        window.addExpense = async function () {

            if (!currentUser) {
                alert("User not authenticated.");
                return;
            }

            const amount = document.getElementById("amountInput").value;
            const time = document.getElementById("timeInput").value;

            let category = document.getElementById("categorySelect").value;
            let reason = document.getElementById("reasonSelect").value;
            let mood = document.getElementById("moodSelect").value;

            if (category === "Other") {
                category = document.getElementById("customCategory").value;
            }

            if (reason === "Other") {
                reason = document.getElementById("customReason").value;
            }

            if (mood === "Other") {
                mood = document.getElementById("customMood").value;
            }

            if (!amount || amount <= 0) {
                alert("Enter valid amount");
                return;
            }

            try {

                const expenseAmount = parseFloat(amount);

                // 1️⃣ Save expense document
                await addDoc(collection(db, "users", currentUser.uid, "expenses"), {
                    amount: expenseAmount,
                    category,
                    reason,
                    mood,
                    time,
                    createdAt: serverTimestamp()
                });

                // 2️⃣ SUBTRACT balance
                const userRef = doc(db, "users", currentUser.uid);

                await updateDoc(userRef, {
                    balance: increment(-expenseAmount)
                });

                alert("Expense saved successfully!");

                // Redirect to home page
                window.location.href = "home.html";

            } catch (error) {
                alert(error.message);
            }
        };


    </script>

</body>

</html>
